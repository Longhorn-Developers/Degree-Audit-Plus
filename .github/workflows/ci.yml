# .github/workflows/ci.yml
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check types
        run: bun run compile
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run eslint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Format
        run: bun run format:check

  create-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Build extension
        run: |
          bun install
          bun run build
          cd .output/chrome-mv3
          zip -r ../degree-audit-plus.zip .
      # archive: false uploads the zip as-is, so people unzip once instead of twice.
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: .output/degree-audit-plus.zip
          archive: false
      # On main, refresh the rolling "latest" release: one permanent public download link.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Newest build of main (commit ${{ github.sha }}).

            **Install:** download `degree-audit-plus.zip` below, unzip it, open `chrome://extensions`, turn on Developer mode, click **Load unpacked**, pick the unzipped folder.
            **Update:** download again, replace the folder contents, and hit the reload icon on the extension card.
        run: |
          gh release create latest --title "Latest build" --notes "$NOTES" || gh release edit latest --notes "$NOTES"
          gh release upload latest .output/degree-audit-plus.zip --clobber
      # Post (or refresh) one download-link comment per PR. Skipped for fork PRs (read-only token).
      - name: Comment download link on PR
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- extension-build -->';
            const body = `${marker}
            ### Extension build ready
            [Download degree-audit-plus.zip](${process.env.URL}) (commit ${context.sha.slice(0, 7)})

            **Install:** unzip, open \`chrome://extensions\`, turn on Developer mode, click **Load unpacked**, pick the folder.
            **Update:** replace the folder contents and hit the reload icon on the extension card.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
