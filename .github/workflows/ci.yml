# .github/workflows/ci.yml
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check types
        run: bun run compile
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run eslint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Format
        run: bun run format:check

  create-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Build extension
        run: |
          bun install
          bun run build
          cd .output/chrome-mv3
          zip -r ../degree-audit-plus.zip .
      # archive: false uploads the zip as-is, so people unzip once instead of twice.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: .output/degree-audit-plus.zip
          archive: false
      # On main, refresh the rolling "latest" release: one permanent public download link.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Newest build of main (commit ${{ github.sha }}).

            **Install:** download `degree-audit-plus.zip` below, unzip it, open `chrome://extensions`, turn on Developer mode, click **Load unpacked**, pick the unzipped folder.
            **Update:** download again, replace the folder contents, and hit the reload icon on the extension card.
        run: |
          gh release create latest --title "Latest build" --notes "$NOTES" || gh release edit latest --notes "$NOTES"
          gh release upload latest .output/degree-audit-plus.zip --clobber
